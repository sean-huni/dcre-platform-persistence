plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'za.co.fnb.dcre'
version = '0.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
repositories { mavenCentral(); mavenLocal() }
dependencies {
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jdbc:4.1.0'
    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc:4.1.0'
}
test { useJUnitPlatform() }
publishing { publications { maven(MavenPublication) { from components.java } } }
